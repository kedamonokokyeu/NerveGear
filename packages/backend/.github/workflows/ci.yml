name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Skip the heavy, camera-only deps (opencv/mediapipe); everything else
        # the test suite needs runs headless in CI.
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest fastapi "uvicorn[standard]" python-multipart \
                      trimesh scipy shapely ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
